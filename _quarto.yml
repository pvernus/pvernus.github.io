project:
  type: website
  # Render only .qmd pages. Without this, Quarto sweeps up every .md in the
  # repo — CLAUDE.md, MEMORY.md, quality_reports/ — and publishes them.
  render:
    - "**/*.qmd"
  resources:
    - profile-dark.jpg
    - garden/links.json
  pre-render: _pre-render.py

website:
  title: "Paul Vernus"
  site-url: https://pvernus.github.io
  favicon: favicon.ico
  navbar:
    background: "#F4F4F4"
    foreground: "dark"
    search: false
    llms-txt: true
    right:
      - cv.qmd
      - garden.qmd
      - text: "Help"
        href: blog/index.qmd
  page-footer:
    right:
      - text: "Colophon"
        href: colophon.qmd

# Bibliography for garden notes. Set here rather than per-note so every note gets
# it — and so it points at the committed garden/_cited.json rather than the
# gitignored _bib/library.json, which does not exist in CI. Generated by
# _pre-render.py. Pages without citations are unaffected.
bibliography: garden/_cited.json
link-citations: true

format:
  html:
    theme:
      light: [journal, brand]
      dark: [darkly, brand]
    css: styles.css
    toc: false
